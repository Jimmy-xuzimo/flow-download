name: Publish test APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-test-apk-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tested source tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.1.0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android build tools
        run: |
          android_sdk_dir="$RUNNER_TEMP/android-sdk"
          android_tools_archive="$RUNNER_TEMP/android-commandline-tools.zip"
          mkdir -p "$android_sdk_dir/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$android_tools_archive"
          unzip -q "$android_tools_archive" -d "$android_sdk_dir/cmdline-tools"
          mv "$android_sdk_dir/cmdline-tools/cmdline-tools" "$android_sdk_dir/cmdline-tools/latest"
          (yes || true) | "$android_sdk_dir/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$android_sdk_dir" --licenses > /dev/null
          "$android_sdk_dir/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$android_sdk_dir" 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$android_sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk_dir" >> "$GITHUB_ENV"
      - name: Run core tests, build APK and check lint
        run: ./gradlew :core:test :app:assembleDebug :app:lintDebug --no-daemon
      - name: Upload and publish testing APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/flow-download-0.1.0-debug.apk
          (cd release && sha256sum flow-download-0.1.0-debug.apk > SHA256SUMS.txt)
          gh release upload v0.1.0 release/flow-download-0.1.0-debug.apk release/SHA256SUMS.txt --clobber
          cat > release/NOTES.md <<'NOTES'
          流速下载 0.1.0 测试版，适用于 Android 10+ 手机和平板。

          支持 HTTP/HTTPS 多连接分段下载、断点续传、批量任务、队列、全局限速、Wi-Fi 策略、系统目录选择与通知栏操作；手机单栏、平板双栏。

          验证：28 项核心测试、6 项 Android 10 手机/平板设备测试通过，Android lint 零错误。设备测试记录对应本地构建；本 APK 由 GitHub Actions 从同一 v0.1.0 源码重新构建，并再次执行核心测试和 lint。Android 16 软件模拟器出现系统级启动超时，运行兼容性仍待真机或硬件加速模拟器补验。

          APK 使用 GitHub 构建环境生成的调试签名，与此前本地测试 APK 签名不同，不能直接覆盖安装。卸载旧应用会清除应用内记录，请先处理需要保留的数据；正式发布需配置自己的固定签名。
          NOTES
          gh release edit v0.1.0 --draft=false --prerelease --notes-file release/NOTES.md
